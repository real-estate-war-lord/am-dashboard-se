<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Macro Dashboard · Sweden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>{{LEAFLET_CSS}}</style>
<style>{{APP_CSS}}</style>
</head>
<body>
<!-- The mobile chrome and the desktop sidebar are two elements, not one that
     changes shape: at 390 px the sidebar is display:none and the bar plus its
     drawer are what navigates, which is also what the tests assert. renderNav()
     writes the same list into #nav and #navdrawer. -->
<div class="app">
  <div class="mtop" data-testid="topbar-mobile">
    <button class="navtog" data-testid="nav-toggle" aria-expanded="false" aria-controls="navdrawer" aria-label="Menu">☰</button>
    <span class="mbrand">Macro Dashboard</span>
    <span class="mview" id="mview"></span>
  </div>
  <aside data-testid="sidebar">
    <div class="brand"><h2>Macro Dashboard</h2></div>
    <div id="nav"></div>
    <div class="side-foot" id="sidefoot"></div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <nav class="drawer" id="drawer" data-testid="nav-drawer" hidden>
    <div class="brand"><h2>Macro Dashboard</h2><button class="drawerx" data-navclose aria-label="Close">✕</button></div>
    <div id="navdrawer"></div>
    <div class="side-foot" id="drawerfoot"></div>
  </nav>
  <main id="main">
    <div class="topbar"><div id="hd"></div><div id="pageact" class="pageact"></div></div>
    <div id="body"></div>
  </main>
</div>
<script>{{LEAFLET_JS}}</script>
<script>window.DATA = {{DATA}};</script>
<script>{{TESTPROP_JS}}</script>
<script>{{ROUTE_JS}}</script>
<script>{{LISTINGS_VIEW_JS}}</script>
<script>{{APP_JS}}</script>
</body>
</html>
